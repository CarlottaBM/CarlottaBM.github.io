<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20201e">

  <title>CV — Carlotta Barone-MacDonald</title>
  <meta
    name="description"
    content="Carlotta Barone-MacDonald's curriculum vitae."
  >

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #20201e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #20201e;
    }

    .document-reader {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .reader-actions {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 2;
      display: flex;
      gap: 8px;
    }

    .reader-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      color: #ffffff;
      background: rgba(24, 24, 23, 0.88);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
    }

    .reader-action:hover,
    .reader-action:focus-visible {
      background: #111110;
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .mobile-fallback {
      display: none;
    }

    @media (max-width: 640px) {
      body {
        overflow: auto;
      }

      .document-reader {
        display: none;
      }

      .reader-actions {
        display: none;
      }

      .mobile-fallback {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
        background: #f5f1e8;
        color: #24231f;
      }

      .mobile-fallback-inner {
        max-width: 30rem;
      }

      .mobile-fallback p {
        margin: 0 0 24px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.75rem, 8vw, 2.5rem);
        line-height: 1.08;
      }

      .mobile-fallback a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: #24231f;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    }
  </style>
</head>

<body>
  <nav class="reader-actions" aria-label="CV document actions">
    <a
      class="reader-action"
      href="../media/CV.pdf"
      target="_blank"
      rel="noopener"
    >Open PDF</a>
    <a
      class="reader-action"
      href="../media/CV.pdf"
      download
    >Download</a>
  </nav>

  <iframe
    class="document-reader"
    src="../media/CV.pdf#view=FitH"
    title="Carlotta Barone-MacDonald's CV"
  ></iframe>

  <main class="mobile-fallback">
    <div class="mobile-fallback-inner">
      <p>Curriculum Vitae</p>
      <a href="../media/CV.pdf">
        Read my CV
      </a>
    </div>
  </main>
</body>
</html>
